apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.name }}-db-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}-db
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-db
    spec:
      containers:
      - name: db
        image: {{ .Values.db.image }}
        ports:
        - containerPort: {{ .Values.db.port }}
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        envFrom:
        - secretRef:
            name: db-secret
        {{- with .Values.db.extraEnv }}
        env:
        {{- range $k, $v := . }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.db.dataDir }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ .Values.name }}-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-db
spec:
  selector:
    app: {{ .Values.name }}-db
  ports:
  - port: {{ .Values.db.port }}
    targetPort: {{ .Values.db.port }}
